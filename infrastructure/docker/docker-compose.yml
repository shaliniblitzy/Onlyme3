# =============================================================================
# Troubleshooting Guide and Common Issues
# =============================================================================
#
# Common issues and solutions for Docker Compose deployment:
#
# 1. **Port Already in Use**:
#    Problem: Port 3000 is already in use on the host system
#    Solution: Change the host port mapping to an available port
#    Example: ports: ["8080:3000"]
#
# 2. **Container Build Failures**:
#    Problem: Docker build fails due to missing dependencies or context
#    Solution: Ensure Dockerfile and source code are in the correct locations
#    Command: docker-compose build --no-cache backend
#
# 3. **Health Check Failures**:
#    Problem: Health checks fail because curl is not available in container
#    Solution: Use alternative health check commands or install curl
#    Alternative: Use wget or Node.js-based health checks
#
# 4. **Volume Mount Issues**:
#    Problem: Volume mounts don't work correctly on Windows or macOS
#    Solution: Check Docker Desktop settings and file sharing permissions
#    Windows: Use WSL2 backend for better volume performance
#
# 5. **Network Connectivity Issues**:
#    Problem: Cannot access the application from host system
#    Solution: Verify port mapping and firewall settings
#    Test: curl http://localhost:3000/hello
#
# 6. **Environment Variable Problems**:
#    Problem: Application doesn't respond to environment variable changes
#    Solution: Restart containers after environment variable modifications
#    Command: docker-compose down && docker-compose up -d
#
# 7. **Permission Issues**:
#    Problem: Container cannot write to mounted volumes
#    Solution: Check file permissions and user mapping
#    Debug: docker-compose exec backend ls -la /usr/src/app
#
# 8. **Resource Constraints**:
#    Problem: Container runs out of memory or CPU
#    Solution: Increase Docker resource limits or add deploy constraints
#    Monitor: docker stats nodejs-hello-tutorial-backend
#
# For additional troubleshooting, use:
# - docker-compose logs backend        # View container logs
# - docker-compose exec backend bash   # Access container shell
# - docker-compose config              # Validate configuration
# - docker-compose ps                  # Check service status
# =============================================================================